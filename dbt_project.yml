name: 'mesh_project'
version: "2.1.0"
profile: mesh-on-demand
require-dbt-version: ">=1.6.0"
config-version: 2



model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  truncate_timespan_to: "{{ current_timestamp() }}"

models:
  mesh_project:
    marts:
      +materialized: table
    staging:
      +materialized: view
    
